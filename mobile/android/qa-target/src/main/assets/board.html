<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#202621;color:#fff;font:16px sans-serif}header{padding:22px 14px}#board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:min(calc(100vw - 24px),calc(100vh - 190px));height:min(calc(100vw - 24px),calc(100vh - 190px));margin:12px}.sq{position:relative;min-height:0;min-width:0}.sq img{width:100%;height:100%;display:block}i.coord{position:absolute;font:700 11px sans-serif;font-style:normal;pointer-events:none}#result{font:bold 24px sans-serif;color:#fff;margin:12px}#result:not(:empty){position:fixed;top:46%;left:8%;width:76%;padding:20px 4%;margin:0;background:#183b28;border:2px solid #a6dcb6;border-radius:12px;text-align:center;z-index:3}button{padding:12px;margin:12px;background:#9bd6ac;border:0;border-radius:10px}</style><header>Offline QA board · tap squares to move<br><span id="status">Starting position</span></header><div id="board"></div><button onclick="next()">Next position</button><button onclick="flipped=!flipped;render()">Flip board</button><button onclick="reset()">New game</button><button onclick="document.getElementById('result').textContent='White won on time'">Show timeout banner</button><button onclick="document.getElementById('result').textContent='Black won by resignation'">Show resignation banner</button><div id="result" role="status"></div><script>
let b='rnbqkbnrpppppppp................................PPPPPPPPRNBQKBNR'.split(''),from=-1,flipped=false,ply=0;function reset(){b='rnbqkbnrpppppppp................................PPPPPPPPRNBQKBNR'.split('');ply=0;from=-1;document.getElementById('result').textContent='';render()}function name(at){return String.fromCharCode(97+at%8)+(8-Math.floor(at/8))}function render(){board.replaceChildren();for(let i=0;i<64;i++){let at=flipped?63-i:i,d=document.createElement('div');d.className='sq';d.style.background=(Math.floor(i/8)+i%8)%2?'#769656':'#eeeed2';if(b[at]!='.'){let img=document.createElement('img');img.src='pieces/'+(b[at]===b[at].toUpperCase()?'w':'b')+b[at].toUpperCase()+'.svg';d.append(img)}if(i%8===0){let n=document.createElement('i');n.className='coord';n.style.cssText='top:2px;left:2px;color:'+(i%16===0?'#769656':'#eeeed2');n.textContent=flipped?Math.floor(i/8)+1:8-Math.floor(i/8);d.append(n)}if(i>=56){let n=document.createElement('i');n.className='coord';n.style.cssText='bottom:1px;right:2px;color:'+(i%2?'#769656':'#eeeed2');n.textContent=String.fromCharCode(97+(flipped?7-i%8:i%8));d.append(n)}d.setAttribute('aria-label',name(at));d.onclick=()=>{if(from<0){from=at;document.getElementById('status').textContent='Selected '+at}else{let move=name(from)+name(at);b[at]=b[from];b[from]='.';from=-1;ply++;document.getElementById('status').textContent='Move accepted '+move;render()}};board.append(d)}}function next(){const seq=[[52,36],[12,28],[62,45],[1,18]];let [f,t]=seq[ply%seq.length];if(b[f]=='.')return;ply++;b[t]=b[f];b[f]='.';document.getElementById('status').textContent='Position '+ply;render()}render();</script>
